<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">WebHook-Dehook: webhook inspection and replay</title>
<desc id="desc">Flow diagram showing a Razorpay webhook entering a raw-body receiver, getting signature checked and stored, then appearing in an event dashboard for inspection, diagnosis, and replay.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101720"/><stop offset="1" stop-color="#0a0e13"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#718292"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><text x="56" y="72" fill="#a3f07b" font-family="monospace" font-size="14" letter-spacing="3">WEBHOOK DEBUGGING</text><text x="56" y="124" fill="#edf3fa" font-family="Arial,sans-serif" font-size="36" font-weight="700">Inspect. Diagnose. Replay.</text><text x="56" y="156" fill="#94a2b3" font-family="Arial,sans-serif" font-size="16">A clear path from webhook delivery to integration troubleshooting.</text>
<g fill="#141c26" stroke="#2a3542"><rect x="55" y="215" width="245" height="190" rx="15"/><rect x="350" y="215" width="245" height="190" rx="15"/><rect x="645" y="215" width="245" height="190" rx="15"/><rect x="940" y="215" width="205" height="190" rx="15"/></g>
<g stroke="#718292" stroke-width="2" marker-end="url(#arrow)"><path d="M300 308h42"/><path d="M595 308h42"/><path d="M890 308h42"/></g>
<g font-family="Arial,sans-serif"><g fill="#a3f07b" font-size="15" font-weight="bold"><text x="80" y="258">01 · RECEIVE</text><text x="375" y="258">02 · VERIFY &amp; STORE</text><text x="670" y="258">03 · INVESTIGATE</text><text x="965" y="258">04 · RESOLVE</text></g><g fill="#edf3fa" font-size="20" font-weight="bold"><text x="80" y="300">Webhook event</text><text x="375" y="300">Raw body check</text><text x="670" y="300">Event dashboard</text><text x="965" y="300">Replay</text></g><g fill="#94a2b3" font-size="14"><text x="80" y="335">Payload · signature</text><text x="80" y="358">event ID · headers</text><text x="375" y="335">HMAC-SHA256 on</text><text x="375" y="358">exact request bytes</text><text x="670" y="335">Duplicates · payment</text><text x="670" y="358">sequence · diagnosis</text><text x="965" y="335">Local endpoint</text><text x="965" y="358">response + timing</text></g><g fill="#708095" font-family="monospace" font-size="12"><text x="80" y="383">RAZORPAY WEBHOOK</text><text x="375" y="383">SQLITE EVENT STORE</text><text x="670" y="383">MERCHANT + DEVELOPER</text><text x="965" y="383">TEST / DEBUG</text></g></g>
<path d="M56 458h1088" stroke="#2a3542"/><text x="56" y="495" fill="#8795a5" font-family="Arial,sans-serif" font-size="14">Built for practical integration troubleshooting with Node.js, Express, and SQLite.</text></svg>
