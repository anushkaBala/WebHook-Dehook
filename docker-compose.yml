services:
  webhook-dehook:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in environment}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_WEBHOOK_SECRETS: ${RAZORPAY_WEBHOOK_SECRETS:-}
      REPLAY_ALLOW_REMOTE: ${REPLAY_ALLOW_REMOTE:-false}
    volumes:
      - webhook_data:/app/data
    restart: unless-stopped
volumes:
  webhook_data:
